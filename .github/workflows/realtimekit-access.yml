name: RealtimeKit access check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Verify RealtimeKit access (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check account-scoped RealtimeKit access
        env:
          REALTIMEKIT_ACCOUNT_ID: ${{ vars.REALTIMEKIT_ACCOUNT_ID }}
          REALTIMEKIT_API_TOKEN: ${{ secrets.REALTIMEKIT_API_TOKEN }}
        run: node scripts/check-realtimekit-access.mjs
