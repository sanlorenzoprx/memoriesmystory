name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "packet-*/**"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Fails on any high or critical advisory in code that ships to people.
      # Accepted moderate advisories are listed in docs/SECURITY/DEPENDENCY_ADVISORIES.md.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify
        run: npm run verify
