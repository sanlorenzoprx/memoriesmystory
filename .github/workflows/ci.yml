name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "packet-*/**"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Cloudflare deployment dry run
        run: npm run deploy:dry-run

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Phone-first end-to-end test
        run: npm run test:e2e
