name: RealtimeKit generated media to private native archive
on:
  workflow_dispatch:
    inputs:
      storage:
        description: Temporary native bindings or isolated real cloud resources
        type: choice
        options:
          - native
          - isolated-cloud
        default: native
      verify_chapters:
        description: Verify owner-private Chapter routes and unchanged source bytes
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: realtimekit-staging-setup
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out reviewed archive candidate
        uses: actions/checkout@v4
        with:
          ref: 3bbb1096b1291fefa5cc0fee80a69519904801fb
          path: call-candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install candidate dependencies
        working-directory: call-candidate
        run: npm ci
      - name: Use the reviewed candidate's locked operator dependencies
        run: ln -s call-candidate/node_modules node_modules
      - name: Install Chromium
        working-directory: call-candidate
        run: npx playwright install --with-deps chromium
      - name: Build candidate
        working-directory: call-candidate
        run: npm run build
      - name: Install media inspection tool
        run: |
          if ! command -v ffprobe > /dev/null || ! command -v ffmpeg > /dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          ffprobe -version > /dev/null
          ffmpeg -version > /dev/null
      - name: Verify real recording into native private archive
        env:
          ARCHIVE_STORAGE_MODE: ${{ inputs.storage }}
          ARCHIVE_VERIFY_CHAPTERS: ${{ inputs.verify_chapters }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.storage == 'isolated-cloud' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          REALTIMEKIT_ACCOUNT_ID: ${{ vars.REALTIMEKIT_ACCOUNT_ID }}
          REALTIMEKIT_API_TOKEN: ${{ secrets.REALTIMEKIT_API_TOKEN }}
        run: node scripts/realtimekit-archive-proof.mjs
