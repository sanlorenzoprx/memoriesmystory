name: Private archive staging read access
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: memoriesmystory-archive-read-preflight
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect existing token metadata permissions only
        env:
          REALTIMEKIT_ACCOUNT_ID: ${{ vars.REALTIMEKIT_ACCOUNT_ID }}
          REALTIMEKIT_API_TOKEN: ${{ secrets.REALTIMEKIT_API_TOKEN }}
        run: node scripts/check-archive-staging-access.mjs
