name: RealtimeKit staging API proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realtimekit-staging-setup
  cancel-in-progress: false

jobs:
  setup:
    name: Configure staging and verify meeting API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reuse or create isolated staging resources and verify synthetic meeting
        env:
          REALTIMEKIT_ACCOUNT_ID: ${{ vars.REALTIMEKIT_ACCOUNT_ID }}
          REALTIMEKIT_API_TOKEN: ${{ secrets.REALTIMEKIT_API_TOKEN }}
        run: node scripts/realtimekit-staging-proof.mjs
